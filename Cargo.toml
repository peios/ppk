[package]
name = "ppk"
version = "0.1.0"
edition = "2024"
description = "Peios package tool"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
libc = "0.2"
# Exact revisions: what verifies a repository, and the roots it trusts,
# change only when this file does.
pso = { git = "https://github.com/peios/pso.git", rev = "bfa22634e6999e626a5cc5a775ebf9fb08d0c4b2" }
pso-roots = { git = "https://github.com/peios/pso-roots.git", rev = "20b5467f81525ed5fd694b6eeb4b6538305d91ba" }
peios-uapi = { path = "vendor/kernel/peios/rust/peios-uapi", default-features = false }
sha2 = "0.10"
tempfile = "3.23"
toml = "0.8"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
zstd = { version = "0.13", default-features = false }
