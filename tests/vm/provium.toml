# Boots a Peios kernel with no initramfs of its own: provium's agent is PID 1
# and the whole userspace, and the tests push in what they need. Run from this
# directory with `provium .` after building ppk for
# x86_64-unknown-linux-musl. See docs/testing.md.

[provium]
roots = ["."]

[profiles.kernel-only]
# The kernel from the cached full-system test image. Any Peios kernel with
# vsock support will do; change the path to use another.
kernel = "/home/jack/.cache/provium/builds/peinit/image/root/usr/lib/modules/7.0.9-peios-0.21.0-alpha11/vmlinuz-7.0.9-peios-0.21.0-alpha11"
cmdline = "console=hvc0 quiet panic=1"
guest_os = "peios"
